<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg,#667eea,#764ba2);
    }

    .login-box{
        background:#fff;
        padding:40px;
        width:320px;
        border-radius:12px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        text-align:center;
    }

    .login-box h2{
        margin-bottom:25px;
        color:#333;
    }

    .input-box{
        margin-bottom:18px;
        text-align:left;
    }

    .input-box label{
        font-size:14px;
        color:#555;
    }

    .input-box input{
        width:100%;
        padding:10px;
        margin-top:5px;
        border:1px solid #ccc;
        border-radius:6px;
        outline:none;
        transition:0.3s;
    }

    .input-box input:focus{
        border-color:#667eea;
    }

    button{
        width:100%;
        padding:12px;
        background:#667eea;
        border:none;
        color:#fff;
        font-size:16px;
        border-radius:6px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#5563d1;
    }

    .extra{
        margin-top:15px;
        font-size:14px;
    }

    .extra a{
        color:#667eea;
        text-decoration:none;
    }

    .extra a:hover{
        text-decoration:underline;
    }
</style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>
    <form>
        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Enter email" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Enter password" required>
        </div>

        <button type="submit">Sign In</button>

        <div class="extra">
            Forgot password? <a href="#">Click here</a>
        </div>
    </form>
</div>

</body>
</html>
